<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111216">
<link rel="manifest" href="/manifest.webmanifest">
<title>Stream Deck</title>
<style>
  :root {
    --accent:#9aa3c0;
    --accent-rgb:154,163,192;
    --text:#f4f5fb;
    --muted:#9a9dab;
    --danger:#ff667a;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }
  html, body {
    margin:0; height:100%; overflow:hidden; overscroll-behavior:none;
    touch-action:manipulation; user-select:none; -webkit-user-select:none;
  }
  body {
    display:grid; place-items:center;
    color:var(--text);
    background:
      radial-gradient(circle at 50% -20%, rgba(112,118,151,.14), transparent 38%),
      #101115;
    font-family:"Segoe UI",Inter,system-ui,-apple-system,sans-serif;
  }

  .shell {
    width:100vw;
    height:100vh;
    height:100dvh;
    display:grid;
    grid-template-columns:150px 1fr;
    grid-template-rows:1fr;
    overflow:hidden;
    border:0;
    border-radius:0;
    background:#16171c;
    box-shadow:none;
  }
  #editButton, .editor-button {
    border:1px solid rgba(255,255,255,.1); border-radius:9px; padding:8px 11px;
    color:var(--text); background:#24262e; font:700 12px/1 "Segoe UI",sans-serif;
    cursor:pointer;
  }
  #editButton:hover, .editor-button:hover { background:#30323b; }
  .status { display:flex; align-items:center; gap:9px; color:var(--muted); font-size:12px; font-weight:650; }
  #dot {
    width:9px; height:9px; padding:0; border:0; border-radius:50%;
    background:#7a4d55; box-shadow:0 0 0 3px rgba(122,77,85,.12);
  }
  #dot.on { background:#42d392; box-shadow:0 0 10px rgba(66,211,146,.55), 0 0 0 3px rgba(66,211,146,.10); }
  .obs-dot {
    width:9px; height:9px; flex:0 0 9px; border-radius:50%;
    background:#7a4d55; box-shadow:0 0 0 3px rgba(122,77,85,.12);
  }
  .obs-dot.on { background:#42d392; box-shadow:0 0 10px rgba(66,211,146,.55), 0 0 0 3px rgba(66,211,146,.10); }

  .sidebar {
    display:flex; flex-direction:column; gap:8px; padding:14px 10px;
    border-right:1px solid rgba(255,255,255,.07);
    background:#121319;
  }
  #profileFilters { display:flex; flex-direction:column; gap:8px; min-height:0; }
  .sidebar-actions {
    display:flex; flex-direction:column; align-items:stretch; gap:10px;
    margin-top:auto; padding-top:12px; border-top:1px solid rgba(255,255,255,.07);
  }
  .sidebar-actions #editButton { min-height:40px; }
  .sidebar-actions #moveButtons { min-height:40px; }
  #moveButtons.active {
    border-color:rgba(139,124,246,.7); color:#fff; background:rgba(139,124,246,.18);
  }
  .sidebar-actions .status { justify-content:center; }
  .nav-label {
    margin:4px 8px 3px; color:#656976; font-size:10px; font-weight:800;
    text-transform:uppercase; letter-spacing:.12em;
  }
  .filter {
    width:100%; height:48px; display:flex; align-items:center; gap:9px;
    border:0; border-radius:11px; padding:0 10px;
    color:#aeb1bd; background:transparent; font:700 12px/1 "Segoe UI",sans-serif;
    cursor:pointer; transition:.16s ease;
  }
  .filter:hover { background:#1d1e25; color:#fff; }
  .filter.active {
    color:#fff;
    background:linear-gradient(90deg, rgba(139,124,246,.18), rgba(139,124,246,.06));
    box-shadow:inset 3px 0 #8b7cf6;
  }
  .filter-icon {
    width:28px; height:28px; flex:0 0 28px; display:grid; place-items:center;
    border-radius:8px; background:#24262e; font-size:15px;
  }
  .filter[data-group="OBS"].active { box-shadow:inset 3px 0 #8b7cf6; background:rgba(139,124,246,.12); }
  .filter[data-group="Discord"].active { box-shadow:inset 3px 0 #5865f2; background:rgba(88,101,242,.12); }
  .filter[data-group="Spotify"].active { box-shadow:inset 3px 0 #1db954; background:rgba(29,185,84,.12); }
  .filter[data-group="Voicemeeter"].active { box-shadow:inset 3px 0 #f4c542; background:rgba(244,197,66,.12); }

  .main {
    min-width:0; min-height:0; display:grid; place-items:center;
    padding:12px;
    background:
      linear-gradient(rgba(255,255,255,.012) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.012) 1px, transparent 1px),
      #1a1b20;
    background-size:24px 24px;
  }
  #deck {
    display:grid; grid-template-columns:repeat(4, var(--key-size));
    gap:var(--gap);
  }
  .key {
    position:relative; width:var(--key-size); height:var(--key-size); padding:10px;
    border:1px solid rgba(255,255,255,.09); border-radius:16px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    color:var(--text); cursor:pointer; overflow:hidden;
    background:
      radial-gradient(100% 90% at 50% 120%, rgba(var(--accent-rgb),.24) 0%, transparent 62%),
      linear-gradient(155deg,var(--key-top,#34363f) 0%,var(--key-bg,#282a31) 58%,var(--key-bottom,#202127) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.14),
      inset 0 -3px 0 rgba(0,0,0,.25),
      0 6px 0 #08090c,
      0 10px 18px rgba(0,0,0,.38);
    transition:transform .07s, box-shadow .07s, filter .14s;
  }
  .key::before {
    content:""; position:absolute; inset:5px; border-radius:12px;
    border:1px solid rgba(255,255,255,.025); pointer-events:none;
  }
  .key-content {
    width:100%; height:100%; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:8px; transform-origin:center; transition:transform .18s ease;
  }
  #deck.move-mode .key { touch-action:none; }
  #deck.move-mode .key:not(.empty) { cursor:grab; }
  #deck.move-mode .key.dragging { opacity:.45; }
  #deck.move-mode .key.empty:not(.disabled).move-target {
    border-color:#b9adff; box-shadow:0 0 0 3px rgba(185,173,255,.35), 0 6px 0 #08090c;
  }
  @media (orientation:portrait) and (max-width:680px), (orientation:portrait) and (pointer:coarse) {
    .key-content { transform:rotate(90deg); }
  }
  @media (hover:hover) and (pointer:fine) {
    .key:not(.empty):not(.down):hover {
      transform:translateY(-3px);
      filter:brightness(1.1);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.18),
        inset 0 -3px 0 rgba(0,0,0,.2),
        0 8px 0 #08090c,
        0 14px 22px rgba(0,0,0,.42);
    }
  }
  .key.empty {
    border-style:dashed;
    color:#838692;
    background:linear-gradient(155deg,#292a30 0%,#202127 58%,#1b1c21 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 4px 0 #08090c;
  }
  .key.empty .ico { font-size:calc(var(--ico-size) * .75); opacity:.5; }
  .key.empty .lbl { color:#9295a1; font-weight:600; }
  .key.empty.disabled { cursor:default; opacity:.25; }
  .key.down {
    transform:translateY(5px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.09),
      inset 0 2px 8px rgba(0,0,0,.18),
      0 1px 0 #08090c,
      0 3px 8px rgba(0,0,0,.45);
  }
  .ico {
    position:relative; z-index:1;
    color:var(--content-color,#e9ebf3); font-size:var(--ico-size); line-height:1;
    filter:drop-shadow(0 4px 5px rgba(0,0,0,.38));
  }
  .ico-image {
    position:relative; z-index:1; width:var(--ico-size); height:var(--ico-size);
    object-fit:contain; filter:drop-shadow(0 4px 5px rgba(0,0,0,.38));
  }
  .ico-tabler {
    display:block; flex:0 0 var(--ico-size); width:var(--ico-size); height:var(--ico-size);
    background-color:var(--content-color,#e9ebf3);
    -webkit-mask:var(--icon-mask) center / contain no-repeat;
    mask:var(--icon-mask) center / contain no-repeat;
    filter:drop-shadow(0 4px 5px rgba(0,0,0,.38));
  }
  .lbl {
    position:relative; z-index:1;
    max-width:92%; color:var(--content-color,#e9ebf3);
    font-size:var(--lbl-size); font-weight:750; line-height:1.1;
    text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .key::after {
    content:""; position:absolute; inset:0; border-radius:inherit;
    border:3px solid transparent; opacity:0; pointer-events:none;
  }
  .key.ok { --accent-rgb:66,211,146; }
  .key.err { --accent-rgb:255,102,122; }
  .key.ok::after { border-color:#42d392; animation:ring .55s ease-out; }
  .key.err::after { border-color:#ff667a; animation:ring .55s ease-out; }
  .key.err { animation:shake .25s; }
  @keyframes ring { 0% { opacity:1; } 100% { opacity:0; } }
  @keyframes shake { 25% { margin-left:-4px; } 75% { margin-left:4px; } }

  #msg {
    position:fixed; left:50%; bottom:16px; transform:translateX(-50%);
    max-width:90%; display:none; z-index:5;
    border:1px solid rgba(255,102,122,.55); border-radius:10px;
    padding:9px 14px; color:#ffd8de; background:#352128;
    font-size:13px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  #msg.success { border-color:rgba(66,211,146,.55); color:#d8fff0; background:#1b332a; }
  #editor {
    position:fixed; inset:0; z-index:10; display:none; grid-template-rows:58px 1fr 58px;
    color:var(--text); background:#16171c;
  }
  #editor.open { display:grid; }
  .editor-head, .editor-foot {
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:0 18px; border-bottom:1px solid rgba(255,255,255,.08); background:#14151a;
  }
  .editor-head strong { font-size:16px; }
  .editor-foot { justify-content:flex-end; border-top:1px solid rgba(255,255,255,.08); border-bottom:0; }
  #saveEditor { border:0; color:#101115; background:#b9adff; }
  #saveEditor:disabled { opacity:.5; cursor:default; }
  #editorStatus { margin-right:auto; color:var(--muted); font-size:12px; }
  .editor-body { min-height:0; display:grid; grid-template-columns:minmax(230px,300px) 1fr; gap:14px; padding:14px; }
  .editor-panel {
    min-width:0; min-height:0; overflow:auto; border:1px solid rgba(255,255,255,.08);
    border-radius:12px; padding:14px; background:#1b1c22;
  }
  .editor-toolbar { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; }
  .grid-setting { display:flex; align-items:center; gap:5px; color:var(--muted); font-size:11px; }
  .grid-setting input { width:44px; }
  .integration-setting { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:10px; color:var(--muted); font-size:11px; }
  .integration-setting strong { width:100%; color:var(--text); }
  .integration-setting label { display:flex; align-items:center; gap:4px; cursor:pointer; }
  .integration-setting input { width:auto; margin:0; accent-color:#b9adff; }
  .integration-hint { width:100%; font-size:10px; }
  .editor-item.integration-off .item-select { color:#81838c; }
  #buttonList { display:flex; flex-direction:column; gap:8px; }
  .profile-button-group {
    display:flex; flex-direction:column; gap:7px; min-width:0;
    padding:8px; border:1px solid rgba(255,255,255,.07); border-radius:8px;
    background:rgba(255,255,255,.015);
  }
  .profile-button-heading {
    margin:0; color:var(--muted); font-size:11px; font-weight:800;
    letter-spacing:.04em; text-transform:uppercase;
  }
  .profile-button-items { display:flex; flex-direction:column; gap:6px; }
  .editor-item {
    display:grid; grid-template-columns:1fr auto auto auto; align-items:center; gap:4px;
    border:1px solid rgba(255,255,255,.06); border-radius:8px; padding:5px;
    background:#202127;
  }
  .editor-item.selected { border-color:#8b7cf6; }
  .editor-item button { min-width:30px; border:0; border-radius:6px; padding:7px; color:var(--text); background:#2a2b33; cursor:pointer; }
  .editor-item .item-select { overflow:hidden; text-align:left; text-overflow:ellipsis; white-space:nowrap; }
  .editor-item .item-delete { color:#ff9aa8; }
  #buttonForm { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); align-content:start; gap:12px; }
  .form-title { grid-column:1/-1; margin:0; font-size:14px; }
  .field { min-width:0; display:flex; flex-direction:column; gap:5px; color:#c8cad3; font-size:11px; font-weight:700; }
  .field.full { grid-column:1/-1; }
  .field input, .field select, .field textarea {
    width:100%; min-width:0; border:1px solid rgba(255,255,255,.1); border-radius:7px; padding:9px;
    color:var(--text); background:#111216; font:500 13px "Segoe UI",sans-serif;
  }
  .field input[type="color"] { height:38px; padding:3px; }
  .field input[type="file"] { font-size:11px; }
  .image-row { display:flex; align-items:center; gap:10px; }
  #imagePreview { width:44px; height:44px; object-fit:contain; border-radius:8px; background:#101115; }
  #iconGrid {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(42px,1fr)); gap:5px;
    max-height:150px; overflow:auto; padding:4px; border:1px solid rgba(255,255,255,.08); border-radius:8px;
  }
  .application-hint { grid-column:1/-1; color:var(--muted); font-size:10px; font-weight:500; }
  .tabler-option {
    height:38px; display:grid; place-items:center; border:1px solid transparent;
    border-radius:6px; background:#25262e; cursor:pointer;
  }
  .tabler-option.selected { border-color:#b9adff; background:#353044; }
  .tabler-option img { width:22px; height:22px; filter:brightness(0) invert(1); }
  .tabler-empty { grid-column:1/-1; padding:8px; color:var(--muted); font-size:11px; }
  #actionFields { grid-column:1/-1; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; padding-top:10px; border-top:1px solid rgba(255,255,255,.08); }
  @media (max-width:680px) {
    .editor-head, .editor-foot { padding:0 10px; }
    .editor-body { grid-template-columns:1fr; grid-template-rows:minmax(110px,25vh) 1fr; gap:8px; padding:8px; }
    .editor-panel { padding:9px; }
    .editor-toolbar { margin-bottom:7px; }
    #buttonList { flex-direction:row; align-items:flex-start; overflow:auto; padding-bottom:4px; }
    .profile-button-group { flex:0 0 min(82vw,280px); max-height:22vh; }
    .profile-button-items { min-height:0; overflow:auto; }
    .editor-item { min-width:0; }
    #buttonForm { gap:8px; }
    #actionFields { gap:8px; }
    #editorStatus { font-size:10px; }
  }
  @media (max-width:680px) {
    .shell {
      width:100vw; height:100dvh;
      grid-template-columns:1fr; grid-template-rows:56px 1fr;
      border:0; border-radius:0;
    }
    .sidebar {
      grid-row:1; min-width:0; flex-direction:row; align-items:center; gap:6px; padding:6px 8px;
      border-right:0; border-bottom:1px solid rgba(255,255,255,.07);
    }
    .nav-label { display:none; }
    #profileFilters { flex:1; min-width:0; flex-direction:row; align-items:center; gap:6px; overflow-x:auto; }
    .filter { width:auto; min-width:48px; height:44px; justify-content:center; padding:0 8px; }
    .filter span:last-child { display:none; }
    .filter.active { box-shadow:inset 0 -3px #8b7cf6; }
    .filter[data-group="Discord"].active { box-shadow:inset 0 -3px #5865f2; }
    .filter[data-group="Spotify"].active { box-shadow:inset 0 -3px #1db954; }
    .filter[data-group="Voicemeeter"].active { box-shadow:inset 0 -3px #f4c542; }
    .sidebar-actions {
      flex:0 0 auto; flex-direction:row; align-items:center; gap:8px;
      margin:0; padding:0 0 0 8px; border-top:0; border-left:1px solid rgba(255,255,255,.12);
    }
    .sidebar-actions #editButton { min-height:40px; padding:7px 9px; white-space:nowrap; }
    .sidebar-actions #moveButtons { width:40px; min-height:40px; padding:7px; }
    .move-label { display:none; }
    .sidebar-actions .status { gap:5px; font-size:10px; white-space:nowrap; }
    #dot { width:10px; height:10px; }
    .main { grid-row:2; padding:10px; }
  }
  @media (prefers-reduced-motion:reduce) {
    .key, .key.err, .key-content { animation:none; transition:none; }
  }
</style>
</head>
<body>
<div class="shell">
  <nav class="sidebar" aria-label="Categorías">
    <div class="nav-label">Perfiles</div>
    <div id="profileFilters"></div>
    <div class="sidebar-actions">
      <button id="moveButtons" class="editor-button" type="button" aria-label="Mover botones" aria-pressed="false" title="Mover botones a casillas vacías">↔ <span class="move-label">Mover</span></button>
      <button id="editButton" type="button">✎ Editar</button>
      <div class="status"><span id="statusText">Conectando</span><button id="dot" aria-label="Conexión"></button></div>
      <div class="status" role="status" aria-live="polite" title="OBS es opcional; solo se necesita para ejecutar sus botones.">
        <span id="obsStatusText">OBS desconectado</span><span id="obsDot" class="obs-dot"></span>
      </div>
    </div>
  </nav>

  <main class="main"><div id="deck"></div></main>
</div>
<div id="msg" role="alert"></div>
<section id="editor" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
  <header class="editor-head">
    <strong id="editorTitle">Personalizar botonera</strong>
    <button id="closeEditor" class="editor-button" type="button">Cerrar</button>
  </header>
  <div class="editor-body">
    <section class="editor-panel" aria-label="Lista de botones">
      <div class="editor-toolbar">
        <button id="addButton" class="editor-button" type="button">+ Agregar botón</button>
        <label class="grid-setting">Filas
          <input id="rows" type="number" min="3" max="12" value="3" aria-label="Filas">
          × Columnas
          <input id="columns" type="number" min="5" max="12" value="5" aria-label="Columnas">
        </label>
      </div>
      <div class="integration-setting">
        <strong>Integraciones de este computador</strong>
        <label><input id="enableSpotify" type="checkbox"> Spotify</label>
        <label><input id="enableVoicemeeter" type="checkbox"> Voicemeeter</label>
        <span class="integration-hint">Oculta y conserva sus botones; no cierra las aplicaciones.</span>
        <span id="nativeIntegrationStatus" class="integration-hint"></span>
      </div>
      <div id="buttonList"></div>
    </section>
    <form id="buttonForm" class="editor-panel">
      <h2 id="formTitle" class="form-title">Selecciona un botón</h2>
      <input id="formId" type="hidden">
      <label class="field">Nombre
        <input id="formLabel" maxlength="32" required>
      </label>
      <label class="field">Perfil
        <input id="formGroup" list="profileNames" maxlength="24" required>
        <datalist id="profileNames"></datalist>
      </label>
      <label class="field full">Emoji o texto del icono
        <input id="formIcon" maxlength="60" placeholder="⭐">
      </label>
      <div class="field full">
        <label for="iconSearch">Biblioteca Tabler Icons</label>
        <input id="iconSearch" maxlength="40" placeholder="Buscar: micrófono, cámara, play...">
        <div id="iconGrid" aria-label="Resultados de iconos"></div>
        <span id="iconSelection"></span>
      </div>
      <label class="field">Imagen del botón
        <input id="formImageFile" type="file" accept="image/png,image/jpeg,image/webp">
      </label>
      <div class="field full image-row">
        <img id="imagePreview" alt="Vista previa del icono">
        <button id="clearImage" class="editor-button" type="button">Quitar imagen</button>
      </div>
      <label class="field">Color de acento
        <input id="formAccent" type="color" value="#9aa3c0">
      </label>
      <label class="field">Color de texto e icono
        <input id="formContentColor" type="color" value="#e9ebf3">
      </label>
      <label class="field">Color de fondo
        <input id="formBackground" type="color" value="#282a31">
      </label>
      <label class="field full">Tipo de acción
        <select id="formType">
          <option value="obs">OBS</option>
        <option value="discord">Discord (atajo de teclado)</option>
          <option value="keys">Atajo de teclado</option>
          <option value="text">Pegar texto</option>
          <option value="spotify">Spotify</option>
          <option value="voicemeeter">Voicemeeter</option>
          <option value="folder">Abrir carpeta</option>
          <option value="application">Abrir aplicación instalada</option>
        </select>
      </label>
      <div id="actionFields"></div>
      <div class="field full">
        <button id="applyButton" class="editor-button" type="submit">Aplicar al diseño</button>
      </div>
    </form>
  </div>
  <footer class="editor-foot">
    <span id="editorStatus">Los cambios se guardan en este computador.</span>
    <button id="saveEditor" class="editor-button" type="button" disabled>Guardar cambios</button>
  </footer>
</section>

<script>
var COLORS = {
  OBS:     { c:'#8b7cf6', rgb:'139,124,246' },
  Discord: { c:'#5865f2', rgb:'88,101,242' },
  Spotify: { c:'#1db954', rgb:'29,185,84' },
  Voicemeeter: { c:'#f4c542', rgb:'244,197,66' }
};
var DEFAULT = { c:'#9aa3c0', rgb:'154,163,192' };
var deck = document.getElementById('deck');
var allButtons = [], buttons = [], keyEls = {}, ws, msgTimer, activeGroup = 'OBS';
var moveMode = false, activeDrag = null, moveSaving = false;
var gridRenderRows = 3, gridRenderColumns = 5;
var enabledIntegrations = { spotify:true, voicemeeter:true }, installedApplicationsPromise = null;
var integrationDiscovery = {
  obs: { connected:false, currentScene:'', streaming:false, recording:false, scenes:[], inputs:[], sceneItems:{} },
  spotify: { available:false, title:'', artist:'', isPlaying:false }
};
var deckRows = 3, deckColumns = 5, draftButtons = [], draftRows = 3, draftColumns = 5, selectedIndex = -1;
var editorTargetPosition = null;
var editorDirty = false, formDirty = false, formImage = '', formIconType = 'emoji', iconSearchTimer, iconSearchRequest = 0;
var editor = document.getElementById('editor');
var buttonForm = document.getElementById('buttonForm');
var imagePreview = document.getElementById('imagePreview');

function build(list) {
  allButtons = normalizeButtonPositions(list);
  renderFilters();
  renderButtons();
}

function updateIntegrations(settings) {
  if (!settings.integrations) return;
  enabledIntegrations = {
    spotify: settings.integrations.spotify !== false,
    voicemeeter: settings.integrations.voicemeeter !== false
  };
}

function updateDiscovery(state) {
  if (!state) return;
  integrationDiscovery = state;
  var obsConnected = !!(state.obs && state.obs.connected);
  document.getElementById('obsStatusText').textContent = obsConnected ? 'OBS conectado' : 'OBS desconectado';
  document.getElementById('obsDot').className = 'obs-dot' + (obsConnected ? ' on' : '');
  var spotify = state.spotify || {};
  var spotifyText = spotify.available
    ? (spotify.title ? 'Spotify: ' + spotify.title + (spotify.artist ? ' — ' + spotify.artist : '') +
      (spotify.isPlaying ? ' · Reproduciendo' : ' · En pausa') :
      (spotify.isPlaying ? 'Spotify reproduciendo' : 'Spotify listo'))
    : 'Spotify sin sesión multimedia';
  document.getElementById('nativeIntegrationStatus').textContent = spotifyText;
  if (editor.classList.contains('open') && !formDirty && document.getElementById('formType').value === 'obs') {
    renderActionFields(selectedIndex < 0 ? null : draftButtons[selectedIndex]);
  }
}

function fillDatalist(id, values) {
  var list = document.getElementById(id);
  if (!list) return;
  list.replaceChildren();
  (values || []).forEach(function (value) {
    var option = document.createElement('option');
    option.value = value;
    list.appendChild(option);
  });
}

function updateObsActionChoices() {
  var action = document.getElementById('actionName');
  var value = document.getElementById('actionValue');
  var scene = document.getElementById('actionScene');
  if (!action || !value) return;
  var obs = integrationDiscovery.obs || {};
  var choices = [];
  if (action.value === 'scene') choices = obs.scenes;
  else if (action.value === 'toggleMute') choices = obs.inputs;
  else if (action.value === 'toggleSource') {
    var sceneName = scene && scene.value || obs.currentScene;
    choices = (obs.sceneItems && obs.sceneItems[sceneName] || []).map(function (item) { return item.sourceName; });
  }
  fillDatalist('obsValueChoices', choices);
  fillDatalist('obsSceneChoices', obs.scenes);
}

function colorRgb(hex, fallback) {
  if (!/^#[0-9a-f]{6}$/i.test(hex || '')) return fallback;
  return [1,3,5].map(function (i) { return parseInt(hex.slice(i, i + 2), 16); }).join(',');
}

function colorHex(hex, fallback) {
  return /^#[0-9a-f]{6}$/i.test(hex || '') ? hex : fallback;
}

function shadeColor(hex, amount) {
  if (!/^#[0-9a-f]{6}$/i.test(hex || '')) return '';
  var channels = [1,3,5].map(function (i) { return parseInt(hex.slice(i, i + 2), 16); });
  return '#' + channels.map(function (c) {
    var value = Math.max(0, Math.min(255, c + amount));
    return ('0' + value.toString(16)).slice(-2);
  }).join('');
}

function isIntegrationEnabled(button) {
  if (button.type === 'spotify') return enabledIntegrations.spotify;
  if (button.type === 'voicemeeter') return enabledIntegrations.voicemeeter;
  return true;
}

function renderFilters() {
  var profileFilters = document.getElementById('profileFilters');
  profileFilters.innerHTML = '';
  var groups = [];
  allButtons.filter(isIntegrationEnabled).forEach(function (b) {
    if (groups.indexOf(b.group) === -1) groups.push(b.group);
  });
  if (!groups.length) groups.push('OBS');
  if (groups.indexOf(activeGroup) === -1) activeGroup = groups[0];
  groups.forEach(function (group) {
    var button = document.createElement('button');
    button.className = 'filter' + (group === activeGroup ? ' active' : '');
    button.dataset.group = group;
    var icon = document.createElement('span');
    icon.className = 'filter-icon';
    icon.textContent = group === 'Voicemeeter' ? '🍌' : (group === 'OBS' ? '◉' : (group === 'Spotify' ? '♫' : (group === 'Discord' ? '◫' : '▣')));
    var text = document.createElement('span');
    text.textContent = group;
    button.appendChild(icon);
    button.appendChild(text);
    button.addEventListener('click', function () {
      setMoveMode(false);
      activeGroup = group;
      renderFilters();
      renderButtons();
    });
    profileFilters.appendChild(button);
  });
}

function renderButtons() {
  buttons = allButtons.filter(function (b) {
    return isIntegrationEnabled(b) && b.group === activeGroup;
  });
  deck.innerHTML = '';
  deck.classList.toggle('move-mode', moveMode);
  keyEls = {};
  var isPhone = window.matchMedia('(pointer:coarse)').matches ||
    Math.min(window.innerWidth, window.innerHeight) <= 680;
  var columns = Math.max(5, Math.min(deckColumns || 5, isPhone ? 5 : 12));
  var highestPosition = allButtons.reduce(function (highest, button, index) {
    if (button.group !== activeGroup) return highest;
    return Math.max(highest, buttonPosition(button, index));
  }, -1);
  var rows = Math.max(3, deckRows || 3, Math.ceil((highestPosition + 1) / columns));
  var visibleByPosition = new Map();
  var occupiedPositions = new Set();
  allButtons.forEach(function (button, index) {
    if (button.group !== activeGroup) return;
    var position = buttonPosition(button, index);
    occupiedPositions.add(position);
    if (isIntegrationEnabled(button)) {
      visibleByPosition.set(position, button);
    }
  });
  for (var position = 0; position < rows * columns; position++) {
    var b = visibleByPosition.get(position);
    if (!b) {
      var empty = document.createElement('button');
      empty.type = 'button';
      empty.className = 'key empty' + (occupiedPositions.has(position) ? ' disabled' : '');
      empty.dataset.position = String(position);
      empty.setAttribute('aria-label', occupiedPositions.has(position) ? 'Botón reservado en este perfil' : 'Crear botón');
      if (!occupiedPositions.has(position)) {
        empty.addEventListener('click', function (slot) {
          return function () { if (!moveMode) openEditor(slot); };
        }(position));
      } else {
        empty.disabled = true;
      }
      deck.appendChild(empty);
      continue;
    }
    var col = COLORS[b.group] || DEFAULT;
    var el = document.createElement('button');
    el.className = 'key';
    el.dataset.position = String(position);
    el.style.setProperty('--accent-rgb', colorRgb(b.accent, col.rgb));
    el.style.setProperty('--content-color', colorHex(b.contentColor, '#e9ebf3'));
    if (b.background) {
      el.style.setProperty('--key-bg', b.background);
      el.style.setProperty('--key-top', shadeColor(b.background, 16));
      el.style.setProperty('--key-bottom', shadeColor(b.background, -12));
    }
    var content = document.createElement('span');
    content.className = 'key-content';
    if (b.image) {
      var ico = document.createElement('img');
      ico.className = 'ico-image';
      ico.src = b.image;
      ico.alt = '';
      content.appendChild(ico);
    } else if (b.iconType === 'tabler') {
      var ico = document.createElement('span');
      ico.className = 'ico-tabler';
      ico.style.setProperty('--icon-mask', 'url("/tabler-icons/' + encodeURIComponent(b.icon) + '")');
      content.appendChild(ico);
    } else {
      var ico = document.createElement('span');
      ico.className = 'ico';
      ico.textContent = b.icon;
      content.appendChild(ico);
    }
    var lbl = document.createElement('span');
    lbl.className = 'lbl';
    lbl.textContent = b.label;
    content.appendChild(lbl);
    el.appendChild(content);
    el.setAttribute('aria-label', b.label);
    (function (element, buttonId) {
      element.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        if (moveMode) {
          if (moveSaving) return;
          activeDrag = {
            buttonId:buttonId,
            pointerId:e.pointerId,
            sourcePosition:Number(element.dataset.position),
            targetPosition:null
          };
          element.classList.add('dragging');
          if (element.setPointerCapture) element.setPointerCapture(e.pointerId);
          return;
        }
        element.classList.add('down');
        press(buttonId);
      });
      ['pointerup','pointercancel','pointerleave'].forEach(function (ev) {
        element.addEventListener(ev, function () { element.classList.remove('down'); });
      });
    })(el, b.id);
    keyEls[b.id] = el;
    deck.appendChild(el);
  }
  gridRenderRows = rows;
  gridRenderColumns = columns;
  layout(rows, columns);
}

function buttonPosition(button, index) {
  return Number.isInteger(button.position) ? button.position : index;
}

function normalizeButtonPositions(list) {
  var occupiedByGroup = new Map();
  return list.map(function (button) {
    if (!occupiedByGroup.has(button.group)) occupiedByGroup.set(button.group, new Set());
    var occupied = occupiedByGroup.get(button.group);
    if (!Number.isInteger(button.position)) {
      button.position = 0;
      while (occupied.has(button.position)) button.position++;
    }
    occupied.add(button.position);
    return button;
  });
}

function findFreePosition(list, capacity, group) {
  var occupied = new Set();
  list.forEach(function (button, index) {
    if (button.group === group) occupied.add(buttonPosition(button, index));
  });
  for (var position = 0; position < capacity; position++) {
    if (!occupied.has(position)) return position;
  }
  return -1;
}

function layout(rows, columns) {
  var main = document.querySelector('.main');
  var rect = main.getBoundingClientRect();
  var isPhone = window.matchMedia('(pointer:coarse)').matches ||
    Math.min(window.innerWidth, window.innerHeight) <= 680;
  var gap = isPhone ? 7 : 14;
  var availableW = rect.width - (isPhone ? 16 : 36);
  var availableH = rect.height - (isPhone ? 16 : 36);
  var size = Math.floor(Math.min(
    (availableW - gap * (columns - 1)) / columns,
    (availableH - gap * (rows - 1)) / rows
  ));
  size = Math.max(32, Math.min(size, isPhone ? 118 : 210));
  deck.style.setProperty('--key-size', size + 'px');
  deck.style.setProperty('--gap', gap + 'px');
  deck.style.setProperty('--ico-size', Math.round(size * .38) + 'px');
  deck.style.setProperty('--lbl-size', Math.max(10, Math.round(size * .105)) + 'px');
  deck.style.gridTemplateColumns = 'repeat(' + columns + ', var(--key-size))';
  deck.style.gridTemplateRows = 'repeat(' + rows + ', var(--key-size))';
}

function relayout() {
  layout(gridRenderRows, gridRenderColumns);
}

function press(id) {
  if (navigator.vibrate) navigator.vibrate(12);
  if (!ws || ws.readyState !== 1) { flash(id, 'err'); return showError('Sin conexión con el computador'); }
  ws.send(JSON.stringify({ id:id }));
}

function flash(id, cls) {
  var el = keyEls[id];
  if (!el) return;
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(function () { el.classList.remove(cls); }, 650);
}

function showMessage(text, success) {
  var m = document.getElementById('msg');
  m.textContent = text;
  m.classList.toggle('success', Boolean(success));
  m.style.display = 'block';
  clearTimeout(msgTimer);
  msgTimer = setTimeout(function () { m.style.display = 'none'; }, 3500);
}

function showError(text) { showMessage(text, false); }
function showSuccess(text) { showMessage(text, true); }

function clearMoveDrag() {
  if (activeDrag && keyEls[activeDrag.buttonId]) {
    keyEls[activeDrag.buttonId].classList.remove('dragging');
  }
  deck.querySelectorAll('.move-target').forEach(function (element) {
    element.classList.remove('move-target');
  });
  activeDrag = null;
}

function setMoveMode(enabled) {
  moveMode = Boolean(enabled);
  if (!moveMode) clearMoveDrag();
  deck.classList.toggle('move-mode', moveMode);
  var moveButton = document.getElementById('moveButtons');
  moveButton.classList.toggle('active', moveMode);
  moveButton.setAttribute('aria-pressed', String(moveMode));
  if (moveMode) showSuccess('Arrastra un botón a una casilla vacía de este perfil');
}

function updateMoveTarget(event) {
  if (!activeDrag) return;
  var hit = document.elementFromPoint(event.clientX, event.clientY);
  var target = hit && hit.closest('#deck .key.empty:not(.disabled)');
  var position = target ? Number(target.dataset.position) : NaN;
  if (!Number.isInteger(position) || position === activeDrag.sourcePosition) target = null;
  deck.querySelectorAll('.move-target').forEach(function (element) {
    element.classList.remove('move-target');
  });
  activeDrag.targetPosition = target ? position : null;
  if (target) target.classList.add('move-target');
}

function saveButtonPosition(buttonId, position) {
  if (moveSaving) return;
  var updatedButtons = allButtons.map(function (button) {
    return button.id === buttonId ? Object.assign({}, button, { position:position }) : button;
  });
  moveSaving = true;
  var moveButton = document.getElementById('moveButtons');
  moveButton.disabled = true;
  showSuccess('Guardando posición…');
  fetch('/editor', {
    method:'PUT',
    headers:{ 'Content-Type':'application/json' },
    body:JSON.stringify({
      buttons:updatedButtons,
      rows:deckRows,
      columns:deckColumns,
      integrations:enabledIntegrations
    })
  }).then(function (response) {
    return response.json().then(function (result) {
      if (!response.ok) throw new Error(result.error || 'No se pudo guardar la posición');
      return result;
    });
  }).then(function () {
    build(updatedButtons);
    showSuccess('Posición guardada');
  }).catch(function (error) {
    showError(error.message);
  }).then(function () {
    moveSaving = false;
    moveButton.disabled = false;
  });
}

function handleMovePointerMove(event) {
  if (!moveMode || !activeDrag || event.pointerId !== activeDrag.pointerId) return;
  event.preventDefault();
  updateMoveTarget(event);
}

function handleMovePointerUp(event) {
  if (!moveMode || !activeDrag || event.pointerId !== activeDrag.pointerId) return;
  event.preventDefault();
  updateMoveTarget(event);
  var drag = activeDrag;
  clearMoveDrag();
  if (Number.isInteger(drag.targetPosition)) {
    saveButtonPosition(drag.buttonId, drag.targetPosition);
  }
}

function handleMovePointerCancel(event) {
  if (!activeDrag || event.pointerId !== activeDrag.pointerId) return;
  clearMoveDrag();
}

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = function () {
    document.getElementById('dot').className = 'on';
    document.getElementById('statusText').textContent = 'Conectado';
  };
  ws.onclose = function () {
    document.getElementById('dot').className = '';
    document.getElementById('statusText').textContent = 'Reconectando';
    setTimeout(connect, 1500);
  };
  ws.onmessage = function (e) {
    var r = JSON.parse(e.data);
    if (r.type === 'integrationState') {
      updateDiscovery(r.state);
    } else if (r.type === 'buttonsChanged') {
      if (editor.classList.contains('open') && editorDirty) {
        document.getElementById('editorStatus').textContent = 'Otro dispositivo guardó cambios. Tus ediciones locales siguen sin guardar.';
        return;
      }
      fetch('/editor').then(function (response) {
        if (!response.ok) throw new Error('No se pudo actualizar la botonera');
        return response.json();
      }).then(function (settings) {
        deckRows = settings.rows || 0;
        deckColumns = settings.columns || 0;
        updateIntegrations(settings);
        updateDiscovery(settings.discovery);
        build(settings.buttons);
        if (editor.classList.contains('open')) openEditor();
      }).catch(function (error) { showError(error.message); });
    } else if (r.ok) flash(r.id, 'ok');
    else { flash(r.id, 'err'); showError(r.error || 'No se pudo ejecutar'); }
  };
}

function keepAwake() {
  if (!('wakeLock' in navigator)) return;
  var lock = function () { navigator.wakeLock.request('screen').catch(function () {}); };
  lock();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) lock(); });
}

function markEditorDirty() {
  editorDirty = true;
  document.getElementById('saveEditor').disabled = false;
  document.getElementById('editorStatus').textContent = 'Hay cambios sin guardar.';
}

function setFormValue(id, value) {
  var field = document.getElementById(id);
  if (field) field.value = value || '';
}

function updateImagePreview() {
  imagePreview.src = formImage || '';
  imagePreview.style.visibility = formImage ? 'visible' : 'hidden';
}

function updateTablerSelection() {
  document.getElementById('iconSelection').textContent =
    formIconType === 'tabler' ? 'Seleccionado: ' + document.getElementById('formIcon').value : '';
  Array.prototype.forEach.call(document.querySelectorAll('.tabler-option'), function (option) {
    option.classList.toggle('selected', formIconType === 'tabler' && option.dataset.icon === document.getElementById('formIcon').value);
  });
}

function getInstalledApplications() {
  if (!installedApplicationsPromise) {
    installedApplicationsPromise = fetch('/installed-applications').then(function (response) {
      return response.json().then(function (result) {
        if (!response.ok) throw new Error(result.error || 'No se pudieron cargar las aplicaciones');
        return result;
      });
    }).catch(function (error) {
      installedApplicationsPromise = null;
      throw error;
    });
  }
  return installedApplicationsPromise;
}

function renderApplicationChoices(selectedId, query) {
  var select = document.getElementById('applicationId');
  if (!select) return;
  getInstalledApplications().then(function (applications) {
    select = document.getElementById('applicationId');
    if (!select) return;
    var search = String(query || '').trim().toLowerCase();
    var matches = applications.filter(function (application) {
      return !search || application.name.toLowerCase().indexOf(search) !== -1;
    });
    var selected = applications.find(function (application) { return application.id === selectedId; });
    if (selected && matches.indexOf(selected) === -1) matches.unshift(selected);
    select.innerHTML = '';
    if (selectedId && !selected) {
      var missing = document.createElement('option');
      missing.value = selectedId;
      missing.textContent = 'No disponible en este computador';
      select.appendChild(missing);
    }
    matches.forEach(function (application) {
      var option = document.createElement('option');
      option.value = application.id;
      option.textContent = application.name;
      select.appendChild(option);
    });
    if (!matches.length && !selectedId) {
      var empty = document.createElement('option');
      empty.value = '';
      empty.textContent = search ? 'No hay coincidencias' : 'No se encontraron aplicaciones';
      select.appendChild(empty);
    }
    if (selectedId) select.value = selectedId;
  }).catch(function (error) {
    showError(error.message);
  });
}

function renderTablerIcons(names) {
  var grid = document.getElementById('iconGrid');
  grid.innerHTML = '';
  if (!names.length) {
    var empty = document.createElement('span');
    empty.className = 'tabler-empty';
    empty.textContent = 'No se encontraron iconos.';
    grid.appendChild(empty);
    return;
  }
  names.forEach(function (name) {
    var option = document.createElement('button');
    option.type = 'button';
    option.className = 'tabler-option';
    option.dataset.icon = name;
    option.title = name;
    option.setAttribute('aria-label', name);
    var image = document.createElement('img');
    image.src = '/tabler-icons/' + encodeURIComponent(name);
    image.alt = '';
    option.appendChild(image);
    option.addEventListener('click', function () {
      formIconType = 'tabler';
      setFormValue('formIcon', name);
      updateTablerSelection();
      formDirty = true;
      markEditorDirty();
    });
    grid.appendChild(option);
  });
  updateTablerSelection();
}

function normalizeTablerQuery(query) {
  var normalized = String(query || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  var aliases = {
    microfono:'microphone', mic:'microphone', camara:'camera', volumen:'volume',
    audio:'volume', audifonos:'headphones', auriculares:'headphones', musica:'music',
    escritorio:'device-desktop', reproducir:'player-play', pausa:'player-pause',
    discord:'brand-discord', spotify:'brand-spotify'
  };
  return aliases[normalized] || normalized;
}

function loadTablerIcons(query) {
  var request = ++iconSearchRequest;
  fetch('/editor-icons?q=' + encodeURIComponent(normalizeTablerQuery(query))).then(function (response) {
    if (!response.ok) throw new Error('No se pudieron cargar los iconos Tabler');
    return response.json();
  }).then(function (names) {
    if (request === iconSearchRequest) renderTablerIcons(names);
  }).catch(function (error) {
    if (request === iconSearchRequest) document.getElementById('iconGrid').textContent = error.message;
  });
}

function renderActionFields(button) {
  var type = document.getElementById('formType').value;
  var host = document.getElementById('actionFields');
  var action = button ? button.action : '';
  host.innerHTML = '';
  if (type === 'obs') {
    host.innerHTML = '<label class="field full">Acción OBS<select id="actionName"><option value="scene">Cambiar escena</option><option value="toggleStream">Iniciar/detener directo</option><option value="startStream">Iniciar directo</option><option value="stopStream">Detener directo</option><option value="toggleRecord">Iniciar/detener grabación</option><option value="toggleMute">Silenciar entrada</option><option value="toggleSource">Mostrar/ocultar fuente</option></select></label><label class="field full" id="valueField">Escena, entrada o fuente<input id="actionValue" maxlength="120" list="obsValueChoices"><datalist id="obsValueChoices"></datalist></label><label class="field full" id="sceneField">Escena de OBS (opcional)<input id="actionScene" maxlength="120" list="obsSceneChoices"><datalist id="obsSceneChoices"></datalist></label><span class="application-hint">No necesitas conectar OBS para guardar el botón. Conéctalo para descubrir opciones y ejecutar acciones.</span>';
    setFormValue('actionName', action || 'scene');
    setFormValue('actionValue', button && button.value);
    setFormValue('actionScene', button && button.scene);
    document.getElementById('actionName').addEventListener('change', updateActionFieldVisibility);
    document.getElementById('actionScene').addEventListener('input', updateObsActionChoices);
    updateActionFieldVisibility();
  } else if (type === 'discord') {
    var keys = button && Array.isArray(button.keys) ? button.keys : ['LeftShift', 'Num1'];
    var preset = keys.length === 2 && keys[0] === 'LeftShift' && keys[1] === 'Num2'
      ? 'deafen'
      : keys.length === 2 && keys[0] === 'LeftShift' && keys[1] === 'Num1' ? 'mute' : 'custom';
    host.innerHTML = '<label class="field full">Acción Discord<select id="discordShortcutPreset"><option value="mute">Silenciar micrófono</option><option value="deafen">Ensordecer</option><option value="custom">Combinación personalizada</option></select></label><label class="field full">Combinación de teclas (separadas por coma)<input id="actionKeys" placeholder="LeftShift, Num1" required></label><span class="application-hint">Usa nombres de teclas como LeftShift, Num1. Configura la misma combinación en Discord → Ajustes de usuario → Combinaciones de teclas.</span>';
    setFormValue('discordShortcutPreset', preset);
    setFormValue('actionKeys', keys.join(', '));
    document.getElementById('discordShortcutPreset').addEventListener('change', function () {
      if (this.value === 'mute') setFormValue('actionKeys', 'LeftShift, Num1');
      else if (this.value === 'deafen') setFormValue('actionKeys', 'LeftShift, Num2');
      else setFormValue('actionKeys', '');
    });
    document.getElementById('actionKeys').addEventListener('input', function () {
      var value = this.value.replace(/\s/g, '').toLowerCase();
      var selectedPreset = value === 'leftshift,num1' ? 'mute' :
        value === 'leftshift,num2' ? 'deafen' : 'custom';
      setFormValue('discordShortcutPreset', selectedPreset);
    });
  } else if (type === 'keys') {
    host.innerHTML = '<label class="field full">Teclas separadas por coma<input id="actionKeys" placeholder="LeftShift, Num1"></label>';
    setFormValue('actionKeys', button && button.keys ? button.keys.join(', ') : '');
  } else if (type === 'text') {
    host.innerHTML = '<label class="field full">Texto que se pegará<textarea id="actionText" maxlength="2000" rows="5" required></textarea></label><span class="application-hint">El texto se pega en la ventana que esté activa en el computador.</span>';
    setFormValue('actionText', button && button.text);
  } else if (type === 'spotify') {
    host.innerHTML = '<label class="field full">Acción de Spotify<select id="actionSpotify"><option value="playpause">Reproducir / Pausa</option><option value="prev">Anterior</option><option value="next">Siguiente</option></select></label>';
    setFormValue('actionSpotify', button && button.cmd ? button.cmd : 'playpause');
  } else if (type === 'voicemeeter') {
    host.innerHTML = '<label class="field full">Acción<select id="actionName"><option value="toggleMute">Silenciar / activar</option><option value="changeVolumePercent">Cambiar volumen en %</option><option value="changeGain">Cambiar volumen en dB</option></select></label><label class="field full">Parámetro (ej. Strip[0].Mute)<input id="actionParam" placeholder="Strip[0].Mute"></label><label class="field full" id="deltaField">Cambio de volumen<input id="actionDelta" type="number" min="-100" max="100" step="1" value="1"></label>';
    setFormValue('actionName', action || 'toggleMute');
    setFormValue('actionParam', button && button.param);
    setFormValue('actionDelta', button && button.delta !== undefined ? button.delta : (action === 'changeGain' ? 2 : 1));
    document.getElementById('actionName').addEventListener('change', updateActionFieldVisibility);
    updateActionFieldVisibility();
  } else if (type === 'application') {
    host.innerHTML = '<label class="field full">Buscar aplicación instalada<input id="applicationSearch" maxlength="60" placeholder="Escribe el nombre"></label><label class="field full">Aplicación que se abrirá<select id="applicationId" required><option value="">Cargando aplicaciones...</option></select></label><span class="application-hint">Solo aparecen accesos directos sin argumentos que apuntan a una app instalada.</span>';
    var applicationId = button && button.appId || '';
    document.getElementById('applicationSearch').addEventListener('input', function (event) {
      event.stopPropagation();
      renderApplicationChoices(document.getElementById('applicationId').value || applicationId, this.value);
    });
    renderApplicationChoices(applicationId, '');
  } else if (type === 'folder') {
    host.innerHTML = '<label class="field full">Ruta de la carpeta<input id="folderPath" maxlength="1024" placeholder="C:\\Users\\TuUsuario\\Documentos" required></label><span class="application-hint">Escribe una ruta local existente de Windows. Al pulsar el botón se abrirá en el Explorador.</span>';
    setFormValue('folderPath', button && button.path);
  }
}

function updateActionFieldVisibility() {
  var type = document.getElementById('formType').value;
  var action = document.getElementById('actionName');
  if (!action) return;
  if (type === 'obs') {
    var needsValue = ['scene', 'toggleMute', 'toggleSource'].indexOf(action.value) !== -1;
    document.getElementById('valueField').style.display = needsValue ? 'flex' : 'none';
    document.getElementById('actionValue').required = needsValue;
    document.getElementById('sceneField').style.display = action.value === 'toggleSource' ? 'flex' : 'none';
    updateObsActionChoices();
  } else if (type === 'voicemeeter') {
    var percentMode = action.value === 'changeVolumePercent';
    var deltaField = document.getElementById('actionDelta');
    document.getElementById('deltaField').style.display = action.value === 'toggleMute' ? 'none' : 'flex';
    document.getElementById('deltaField').firstChild.textContent = percentMode ? 'Cambio en %' : 'Cambio en dB';
    deltaField.min = percentMode ? '-100' : '-12';
    deltaField.max = percentMode ? '100' : '12';
    if (percentMode && (!deltaField.value || Math.abs(Number(deltaField.value)) > 100)) deltaField.value = '1';
  }
}

function setEditorForm(button, index) {
  selectedIndex = index;
  editorTargetPosition = buttonPosition(button, index);
  formDirty = false;
  document.getElementById('formTitle').textContent = index < 0 ? 'Nuevo botón' : 'Editar botón';
  setFormValue('formId', button.id);
  setFormValue('formLabel', button.label);
  setFormValue('formGroup', button.group);
  setFormValue('formIcon', button.icon);
  formIconType = button.iconType || 'emoji';
  updateTablerSelection();
  setFormValue('formAccent', button.accent || (COLORS[button.group] || DEFAULT).c);
  setFormValue('formContentColor', colorHex(button.contentColor, '#e9ebf3'));
  setFormValue('formBackground', button.background || '#282a31');
  setFormValue('formType', button.type === 'keys' && button.group.toLowerCase() === 'discord'
    ? 'discord'
    : button.type || 'obs');
  formImage = button.image || '';
  updateImagePreview();
  renderActionFields(button);
  renderButtonList();
}

function renderButtonList() {
  var list = document.getElementById('buttonList');
  var profiles = document.getElementById('profileNames');
  list.innerHTML = '';
  profiles.innerHTML = '';
  var orderByGroup = new Map();
  draftButtons.forEach(function (button, index) {
    if (!orderByGroup.has(button.group)) orderByGroup.set(button.group, []);
    orderByGroup.get(button.group).push(index);
  });
  orderByGroup.forEach(function (indices) {
    indices.sort(function (a, b) {
      return buttonPosition(draftButtons[a], a) - buttonPosition(draftButtons[b], b);
    });
  });
  orderByGroup.forEach(function (indices, group) {
    var section = document.createElement('section');
    section.className = 'profile-button-group';
    var heading = document.createElement('h3');
    heading.className = 'profile-button-heading';
    heading.textContent = group + ' · ' + indices.length;
    section.appendChild(heading);
    var items = document.createElement('div');
    items.className = 'profile-button-items';
    indices.forEach(function (index, groupIndex) {
      var button = draftButtons[index];
      var row = document.createElement('div');
      row.className = 'editor-item' + (index === selectedIndex ? ' selected' : '');
      if (!isIntegrationEnabled(button)) row.className += ' integration-off';
      row.dataset.index = index;
      var select = document.createElement('button');
      select.type = 'button';
      select.className = 'item-select';
      select.dataset.action = 'select';
      select.textContent = (button.icon || '▣') + '  ' + button.label +
        (isIntegrationEnabled(button) ? '' : ' · integración apagada');
      var up = document.createElement('button');
      up.type = 'button';
      up.dataset.action = 'up';
      up.textContent = '↑';
      up.disabled = groupIndex === 0;
      var down = document.createElement('button');
      down.type = 'button';
      down.dataset.action = 'down';
      down.textContent = '↓';
      down.disabled = groupIndex === indices.length - 1;
      var remove = document.createElement('button');
      remove.type = 'button';
      remove.dataset.action = 'delete';
      remove.className = 'item-delete';
      remove.textContent = '×';
      row.appendChild(select);
      row.appendChild(up);
      row.appendChild(down);
      row.appendChild(remove);
      items.appendChild(row);
    });
    section.appendChild(items);
    list.appendChild(section);
  });
  orderByGroup.forEach(function (indices, group) {
    var option = document.createElement('option');
    option.value = group;
    profiles.appendChild(option);
  });
}

function openEditor(targetPosition) {
  var requestedPosition = Number.isInteger(targetPosition) ? targetPosition : null;
  draftButtons = JSON.parse(JSON.stringify(allButtons))
    .map(function (button, index) {
      button.position = buttonPosition(button, index);
      return button;
    })
    .sort(function (a, b) { return a.position - b.position; });
  draftRows = Math.max(3, deckRows);
  draftColumns = Math.max(5, deckColumns);
  editorTargetPosition = requestedPosition;
  setFormValue('rows', draftRows);
  setFormValue('columns', draftColumns);
  document.getElementById('enableSpotify').checked = enabledIntegrations.spotify;
  document.getElementById('enableVoicemeeter').checked = enabledIntegrations.voicemeeter;
  editorDirty = false;
  formDirty = false;
  selectedIndex = -1;
  document.getElementById('saveEditor').disabled = true;
  document.getElementById('editorStatus').textContent = 'Los cambios se guardan en este computador.';
  editor.classList.add('open');
  loadTablerIcons(document.getElementById('iconSearch').value);
  renderButtonList();
  if (requestedPosition !== null) clearEditorForm();
  else if (draftButtons.length) setEditorForm(draftButtons[0], 0);
  else {
    editorTargetPosition = findFreePosition(draftButtons, draftRows * draftColumns, activeGroup);
    clearEditorForm();
  }
}

function clearEditorForm() {
  selectedIndex = -1;
  formDirty = false;
  buttonForm.reset();
  setFormValue('formId', '');
  setFormValue('formLabel', '');
  setFormValue('formGroup', activeGroup);
  setFormValue('formIcon', '⭐');
  formIconType = 'emoji';
  updateTablerSelection();
  setFormValue('formAccent', (COLORS[activeGroup] || DEFAULT).c);
  setFormValue('formContentColor', '#e9ebf3');
  setFormValue('formBackground', '#282a31');
  setFormValue('formType', activeGroup.toLowerCase() === 'discord' ? 'discord' : 'obs');
  formImage = '';
  updateImagePreview();
  document.getElementById('formTitle').textContent = 'Nuevo botón';
  renderActionFields(null);
  renderButtonList();
}

function formButtonValue() {
  var button = {
    id: document.getElementById('formId').value,
    label: document.getElementById('formLabel').value.trim(),
    group: document.getElementById('formGroup').value.trim(),
    icon: document.getElementById('formIcon').value,
    iconType: formIconType,
    accent: document.getElementById('formAccent').value,
    contentColor: document.getElementById('formContentColor').value,
    background: document.getElementById('formBackground').value,
    image: formImage,
    position: editorTargetPosition
  };
  var selectedType = document.getElementById('formType').value;
  button.type = selectedType === 'discord' ? 'keys' : selectedType;
  if (button.type === 'obs') {
    button.action = document.getElementById('actionName').value;
    button.value = document.getElementById('actionValue').value.trim();
    button.scene = document.getElementById('actionScene').value.trim();
  } else if (button.type === 'keys') {
    button.keys = document.getElementById('actionKeys').value.split(',').map(function (key) { return key.trim(); }).filter(Boolean);
  } else if (button.type === 'text') {
    button.text = document.getElementById('actionText').value;
  } else if (button.type === 'spotify') {
    button.cmd = document.getElementById('actionSpotify').value;
  } else if (button.type === 'application') {
    button.appId = document.getElementById('applicationId').value;
  } else if (button.type === 'folder') {
    button.path = document.getElementById('folderPath').value.trim();
  } else if (button.type === 'voicemeeter') {
    button.action = document.getElementById('actionName').value;
    button.param = document.getElementById('actionParam').value.trim();
    button.delta = Number(document.getElementById('actionDelta').value);
  }
  return button;
}

function commitEditorForm() {
  var iconField = document.getElementById('formIcon');
  iconField.setCustomValidity(formIconType === 'emoji' && iconField.value.length > 12
    ? 'El emoji o símbolo debe tener máximo 12 caracteres'
    : '');
  if (!buttonForm.reportValidity()) return false;
  var button = formButtonValue();
  if (!button.id) button.id = 'btn-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  var positionConflict = !Number.isInteger(button.position) ||
    draftButtons.some(function (existing, index) {
      return index !== selectedIndex && existing.group === button.group &&
        buttonPosition(existing, index) === button.position;
    });
  if (positionConflict) {
    showError('La casilla ya está ocupada en ese perfil; selecciona otra');
    return false;
  }
  if (selectedIndex < 0) {
    draftButtons.push(button);
    draftButtons.sort(function (a, b) { return a.position - b.position; });
    selectedIndex = draftButtons.findIndex(function (existing) { return existing.id === button.id; });
  } else {
    draftButtons[selectedIndex] = button;
  }
  setFormValue('formId', button.id);
  formDirty = false;
  markEditorDirty();
  renderButtonList();
  document.getElementById('formTitle').textContent = 'Editar botón';
  return true;
}

function closeEditor() {
  if ((editorDirty || formDirty) && !window.confirm('Hay cambios sin guardar. ¿Descartarlos?')) return;
  editor.classList.remove('open');
}

document.getElementById('editButton').addEventListener('click', function () {
  setMoveMode(false);
  openEditor();
});
document.getElementById('moveButtons').addEventListener('click', function () {
  if (!moveSaving) setMoveMode(!moveMode);
});
document.getElementById('closeEditor').addEventListener('click', closeEditor);
document.getElementById('addButton').addEventListener('click', function () {
  if (formDirty && !commitEditorForm()) return;
  editorTargetPosition = findFreePosition(draftButtons, draftRows * draftColumns, activeGroup);
  if (editorTargetPosition < 0) return showError('La cuadrícula está llena; amplíala para agregar más botones');
  clearEditorForm();
});
document.getElementById('columns').addEventListener('input', function () {
  draftColumns = Number(this.value);
  markEditorDirty();
});
document.getElementById('rows').addEventListener('input', function () {
  draftRows = Number(this.value);
  markEditorDirty();
});
document.getElementById('enableSpotify').addEventListener('change', markEditorDirty);
document.getElementById('enableVoicemeeter').addEventListener('change', markEditorDirty);
document.getElementById('formIcon').addEventListener('input', function () {
  formIconType = 'emoji';
  this.setCustomValidity(this.value.length > 12 ? 'El emoji o símbolo debe tener máximo 12 caracteres' : '');
  updateTablerSelection();
});
document.getElementById('iconSearch').addEventListener('input', function () {
  clearTimeout(iconSearchTimer);
  var query = this.value;
  iconSearchTimer = setTimeout(function () { loadTablerIcons(query); }, 180);
});
buttonForm.addEventListener('input', function () {
  formDirty = true;
  markEditorDirty();
});
buttonForm.addEventListener('change', function () {
  formDirty = true;
  markEditorDirty();
});
buttonForm.addEventListener('submit', function (event) {
  event.preventDefault();
  commitEditorForm();
});
document.getElementById('formType').addEventListener('change', function () {
  if (this.value === 'discord') setFormValue('formGroup', 'Discord');
  renderActionFields(null);
  formDirty = true;
  markEditorDirty();
});
document.getElementById('formImageFile').addEventListener('change', function () {
  var file = this.files && this.files[0];
  if (!file) return;
  if (file.size > 500 * 1024) {
    this.value = '';
    return showError('La imagen debe pesar menos de 500 KB');
  }
  var reader = new FileReader();
  reader.onload = function () {
    formImage = String(reader.result);
    updateImagePreview();
    formDirty = true;
    markEditorDirty();
  };
  reader.onerror = function () { showError('No se pudo leer la imagen'); };
  reader.readAsDataURL(file);
});
document.getElementById('clearImage').addEventListener('click', function () {
  formImage = '';
  document.getElementById('formImageFile').value = '';
  updateImagePreview();
  formDirty = true;
  markEditorDirty();
});
document.getElementById('buttonList').addEventListener('click', function (event) {
  var action = event.target.dataset.action;
  var row = event.target.closest('.editor-item');
  if (!action || !row) return;
  if (formDirty && !commitEditorForm()) return;
  var index = Number(row.dataset.index);
  if (action === 'select') {
    setEditorForm(draftButtons[index], index);
  } else if (action === 'delete') {
    if (!window.confirm('¿Eliminar este botón?')) return;
    draftButtons.splice(index, 1);
    selectedIndex = -1;
    clearEditorForm();
    markEditorDirty();
  } else {
    var groupOrder = draftButtons.map(function (button, buttonIndex) {
      return { button:button, index:buttonIndex };
    }).filter(function (entry) {
      return entry.button.group === draftButtons[index].group;
    }).sort(function (a, b) {
      return buttonPosition(a.button, a.index) - buttonPosition(b.button, b.index);
    });
    var groupIndex = groupOrder.findIndex(function (entry) { return entry.index === index; });
    var targetEntry = groupOrder[groupIndex + (action === 'up' ? -1 : 1)];
    if (!targetEntry) return;
    var moved = draftButtons[index];
    var movedPosition = buttonPosition(moved, index);
    moved.position = buttonPosition(targetEntry.button, targetEntry.index);
    targetEntry.button.position = movedPosition;
    draftButtons.sort(function (a, b) { return a.position - b.position; });
    selectedIndex = draftButtons.findIndex(function (button) { return button.id === moved.id; });
    markEditorDirty();
    renderButtonList();
  }
});
document.getElementById('saveEditor').addEventListener('click', function () {
  if (formDirty && !commitEditorForm()) return;
  var rowsValue = Number(document.getElementById('rows').value);
  var columnsValue = Number(document.getElementById('columns').value);
  var integrationsValue = {
    spotify: document.getElementById('enableSpotify').checked,
    voicemeeter: document.getElementById('enableVoicemeeter').checked
  };
  if (!Number.isInteger(rowsValue) || rowsValue < 3 || rowsValue > 12 ||
      !Number.isInteger(columnsValue) || columnsValue < 5 || columnsValue > 12) {
    return showError('La cuadrícula debe tener al menos 3 filas y 5 columnas, con un máximo de 12');
  }
  var positionsByGroup = new Map();
  var invalidPosition = draftButtons.some(function (button, index) {
    var position = buttonPosition(button, index);
    if (position < 0 || position >= rowsValue * columnsValue) return true;
    if (!positionsByGroup.has(button.group)) positionsByGroup.set(button.group, new Set());
    var positions = positionsByGroup.get(button.group);
    if (positions.has(position)) return true;
    positions.add(position);
    return false;
  });
  if (invalidPosition) {
    return showError('Hay una casilla fuera de la cuadrícula o repetida en el mismo perfil');
  }
  var saveButton = this;
  saveButton.disabled = true;
  document.getElementById('editorStatus').textContent = 'Guardando…';
  fetch('/editor', {
    method:'PUT',
    headers:{ 'Content-Type':'application/json' },
    body:JSON.stringify({ buttons:draftButtons, rows:rowsValue, columns:columnsValue, integrations:integrationsValue })
  }).then(function (response) {
    return response.json().then(function (result) {
      if (!response.ok) throw new Error(result.error || 'No se pudieron guardar los cambios');
      return result;
    });
  }).then(function () {
    allButtons = normalizeButtonPositions(JSON.parse(JSON.stringify(draftButtons)));
    deckRows = rowsValue;
    deckColumns = columnsValue;
    enabledIntegrations = integrationsValue;
    editorDirty = false;
    formDirty = false;
    renderFilters();
    renderButtons();
    renderButtonList();
    document.getElementById('editorStatus').textContent = 'Cambios guardados en este computador.';
  }).catch(function (error) {
    saveButton.disabled = false;
    document.getElementById('editorStatus').textContent = error.message;
  });
});

document.getElementById('dot').addEventListener('click', function () {
  var d = document.documentElement;
  if (document.fullscreenElement) document.exitFullscreen();
  else if (d.requestFullscreen) d.requestFullscreen().catch(function () {});
});
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
document.addEventListener('pointermove', handleMovePointerMove, { passive:false });
document.addEventListener('pointerup', handleMovePointerUp);
document.addEventListener('pointercancel', handleMovePointerCancel);
window.addEventListener('resize', relayout);
window.addEventListener('orientationchange', function () { setTimeout(relayout, 150); });

fetch('/editor').then(function (r) {
  if (!r.ok) throw new Error('No se pudo cargar la configuración');
  return r.json();
}).then(function (settings) {
  deckRows = settings.rows || 0;
  deckColumns = settings.columns || 0;
  updateIntegrations(settings);
  updateDiscovery(settings.discovery);
  build(settings.buttons);
  connect();
  keepAwake();
}).catch(function (error) { showError(error.message); });
</script>
</body>
</html>
